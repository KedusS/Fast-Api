{% extends 'layout.html' %}

{% block title %}Log in | Juicebox{% endblock %}

{% block content %}
<section class="auth-shell">
    <div class="auth-card">
        <p class="eyebrow">WELCOME BACK</p>
        <h1>Log in to Juicebox</h1>
        <p class="muted">Pick up where your music left off.</p>
        <form id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input id="username" type="text" class="form-control" name="username" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input id="password" type="password" class="form-control" name="password" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Log in</button>
            <p id="authError" class="form-error" role="alert" hidden></p>
        </form>
        <p class="auth-footer">New here? <a href="/auth/register-page">Create an account</a></p>
    </div>
 </section>
{% endblock %}
