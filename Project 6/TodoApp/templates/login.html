{% extends 'layout.html' %}

{% block title %}Log in | Juicebox{% endblock %}

{% block content %}
<div class="container">
    <section class="card auth-card">
        <div class="card-header">Log in to Juicebox</div>
        <div class="card-body">
            <p class="card-text">Sign in to save and manage your playlists.</p>
        <form action="/auth/login" method="post">
            <div class="form-group">
                <label for="username">Username</label>
                <input id="username" type="text" class="form-control" name="username" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input id="password" type="password" class="form-control" name="password" autocomplete="current-password" required>
            </div>
            <button type="submit" class="btn btn-primary btn-block">Log in</button>
            {% if error %}
            <p class="form-error" role="alert">{{ error }}</p>
            {% endif %}
        </form>
        </div>
        <div class="card-footer">New here? <a href="/auth/register-page">Create an account</a></div>
    </section>
</div>
{% endblock %}
